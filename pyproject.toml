[project]
name = "my-agent-app"
version = "0.1.0"
description = "Agente inteligente com FastAPI + LangChain + MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "jinja2>=3.1.6",
    "langchain[anthropic]>=1.3.14",
    "langchain-mcp-adapters>=0.3.0",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "uvicorn>=0.51.0",
    "python-dotenv>=1.2.2",
    "markdown>=3.10.2",
    "httpx>=0.28.1",
    "kubernetes>=37.0.1",
    "nh3>=0.3.7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
