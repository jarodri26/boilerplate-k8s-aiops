# Postgres in-cluster para ambientes de teste (kind). Em producao, prefira um banco gerenciado.
apiVersion: v1
kind: Service
metadata:
  name: aiops-postgres
  namespace: aiops-system
spec:
  selector:
    app: aiops-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiops-postgres
  namespace: aiops-system
spec:
  serviceName: aiops-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aiops-postgres
  template:
    metadata:
      labels:
        app: aiops-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef:
                name: aiops-postgres-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
